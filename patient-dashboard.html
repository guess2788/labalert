<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabAlert — My Results</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-wait">
  <header class="topbar">
    <div class="brand">🔬 LabAlert</div>
    <nav>
      <span id="welcomeMsg"></span>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </header>
  <main class="container">
    <section class="card">
      <h1>My Lab Results</h1>
      <p class="subtitle">All your results are listed below, most recent first.</p>
      <div id="resultsList">
        <p id="loadingMsg">Loading your results…</p>
      </div>
    </section>
  </main>
  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, orderBy, getDocs, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.replace("patient-login.html"); return; }
      document.body.classList.remove("auth-wait");

      // Get patient profile
      const patientDoc = await getDoc(doc(db, "patients", user.uid));
      if (patientDoc.exists()) {
        const { fullName, phone } = patientDoc.data();
        document.getElementById("welcomeMsg").textContent = `👋 ${fullName}`;

        // Query results matching patient's phone number
        const q = query(
          collection(db, "results"),
          where("phone", "==", phone),
          orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(q);
        const list = document.getElementById("resultsList");

        if (snapshot.empty) {
          list.innerHTML = `<p class="empty-msg">No results found yet. Ask your lab technician to enter your phone number when saving your results.</p>`;
          return;
        }

        list.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const r = docSnap.data();
          const statusClass = r.status === "Normal" ? "badge-normal"
                            : r.status === "Abnormal" ? "badge-abnormal"
                            : "badge-critical";
          const card = document.createElement("div");
          card.className = "result-card";
          card.innerHTML = `
            <div class="result-header">
              <span class="result-test">${r.testType}</span>
              <span class="badge ${statusClass}">${r.status}</span>
            </div>
            <div class="result-body">
              <p><strong>Result:</strong> ${r.resultValue} ${r.unit || ""}</p>
              <p><strong>Reference Range:</strong> ${r.refRange || "N/A"}</p>
              <p><strong>Next Appointment:</strong> ${r.nextAppointment || "Not set"}</p>
              <p class="result-date">${r.createdAt?.toDate?.()?.toLocaleDateString() || ""}</p>
            </div>
            <a href="result.html?id=${docSnap.id}" class="btn-secondary btn-sm">View Full Result</a>
          `;
          list.appendChild(card);
        });
      }
    });

    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.replace("patient-login.html");
    });
  </script>
</body>
</html>
